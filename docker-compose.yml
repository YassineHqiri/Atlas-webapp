version: '3.8'
services:
  # Database
  atlastech-db:
    image: mysql:8.0
    container_name: atlastech-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: atlastech
      MYSQL_USER: atlastech
      MYSQL_PASSWORD: atlastech
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - atlas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  atlastech-backend:
    build:
      context: ./atlastech-backend
      dockerfile: Dockerfile
    container_name: atlastech-backend
    ports:
      - "8080:80"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=atlastech-db
      - DB_DATABASE=atlastech
      - DB_USERNAME=atlastech
      - DB_PASSWORD=atlastech
    networks:
      - atlas-network
    restart: unless-stopped
    depends_on:
      atlastech-db:
        condition: service_healthy

  # Frontend
  atlastech-frontend:
    build:
      context: ./atlastech-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: atlastech-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - atlas-network
    depends_on:
      - atlastech-backend

networks:
  atlas-network:
    driver: bridge

volumes:
  mysql_data:
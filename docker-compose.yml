version: '3.8'
services:
  # Backend API
  atlastech-backend:
    build:
      context: ./atlastech-backend
      dockerfile: Dockerfile
    container_name: atlastech-backend
    ports:
      - "8080:80"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - atlas-network
    restart: unless-stopped

  # Frontend
  atlastech-frontend:
    build:
      context: ./atlastech-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: atlastech-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - atlas-network
    depends_on:
      - atlastech-backend

networks:
  atlas-network:
    driver: bridge
